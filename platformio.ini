[platformio]
default_envs = native_tests

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = -D'SSID = '${sysenv.WIFI_SSID} -D'PASSWD = '${sysenv.WIFI_PASSWD}

[env:calibration_at_ib]
extends = env:esp32-s3-devkitc-1
build_flags = -DCALIBRATION_AT_IB -D'SSID = '${sysenv.WIFI_SSID} -D'PASSWD = '${sysenv.WIFI_PASSWD}

[env:calibration_no_current]
extends = env:esp32-s3-devkitc-1
build_flags = -DCALIBRATION_NO_CURRENT -D'SSID = '${sysenv.WIFI_SSID} -D'PASSWD = '${sysenv.WIFI_PASSWD}

[env:native_tests]
platform = native
build_flags = -lm
lib_deps = adc
test_ignore = test_adc_functions

[env:selected_native_tests]
extends = env:native_tests
test_filter = test_misc