<!DOCTYPE html>
<html>
  <head>
    <title>calibration PV router</title>
    <style>
    body {font-family:Arial; background-color: white;}
    td {vertical-align: top;}
    textarea {font-family:Arial; width:300px; height:500px}
    </style>
  </head>
  <body id='initialise'>
  <button onclick='click_Ib_calibration()'>Ib calibration</button>
  <button onclick='click_no_current_calibration()'>No current calibration</button>
  <br></br>
  <h2>Calibration</h2>
  <table>
    <tr>
      <td>
        <textarea id='rxText' onfocus='this.value=""'></textarea>
        <br>
      </td>
      <td>
        <textarea id='errorText' onfocus='this.value=""'></textarea>
        <br>
      </td>
      <td>
        <label for="Ugain">Ugain</label><br>
        <input type="number" id='Ugain' onchange='sendGain()'><br><br>
        <label for="IgainL">IgainL</label><br>
        <input type="number" id='IgainL' onchange='sendGain()'><br><br>
        <label for="IgainN">IgainN</label><br>
        <input type="number" id='IgainN' onchange='sendGain()'><br><br>
      </td>
    </tr>
  </table>

  <script>
  var wskt;
  document.getElementById('initialise').onload = function()
  {init()};
  function init()// open WebSocket
  {
    console.log('Trying to open a WebSocket connection...');
    wskt = new WebSocket('ws://' + window.location.hostname + '/ws');
    wskt.onopen =  function(event){console.log('connection opened');};
    wskt.onclose = function(event){console.log('connection closed');};
    wskt.onmessage = function(rx)
    {  // client receive message
      console.log('message received');
      console.log('rx : ' + rx);
      var obj = JSON.parse(rx.data);
      try {
        let gainsLen = obj.gains.length;
        for (let i = 0; i < gainsLen; i++) {
        document.getElementById(obj.gains[i].id).value = obj.gains[i].value;
        }
      }
      catch(e)
      {
        document.getElementById('errorText').value += obj + "\n";
      }
    };
  }

  function click_Ib_calibration()
  {
    //wskt.send('4');
    document.getElementById('Ugain').value = 44;
    document.getElementById('errorText').value += "Ib calibration\n";
  };

  function click_no_current_calibration()
  {
    wskt.send('5');
    document.getElementById('errorText').value += "No current calibration\n";
  };

  function sendGain()
  {
    const obj = '{"' + event.target.id + '":' + event.target.value + "}";
    console.log(obj);
    wskt.send(JSON.stringify(obj));
    console.log(JSON.stringify(obj));
  };
  </script>
  </body>
</html>
